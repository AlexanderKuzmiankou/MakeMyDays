services:
  app:
    image: 003720227935.dkr.ecr.eu-central-1.amazonaws.com/makemyday:latest
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - AWS_DEFAULT_REGION=eu-central-1
    volumes:
      - ~/credentials/.aws:/root/.aws:ro
    mem_limit: 256m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - /home/pi/makemydays/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    mem_limit: 128m
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=makemydaysgrafana
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_REPORTING_ENABLED=false
      - GF_LOG_LEVEL=warn
    mem_limit: 256m
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    mem_limit: 64m
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
